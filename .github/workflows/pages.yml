# Publishes app/ with GitHub Pages whenever it changes on main.
# Once, in the repository, before the first push: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish the app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Pages lets browsers keep each file for 10 minutes, and a reload gets the new page but can keep the old scripts.
      # New links for each commit make that mix impossible.
      - name: Stamp the page's links with this commit
        run: |
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" app/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
